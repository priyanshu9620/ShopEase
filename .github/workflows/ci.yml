# CI: build the image, smoke-test it, publish to GHCR.
#   PR / lab branches → build + smoke, image pushed as ghcr.io/<owner>/shopease:<branch>-<sha>
#   master            → additionally tagged :latest  (deploy.yml, Phase 3, rolls it out to EC2)
name: ci

on:
  push:
    branches: [master, "lab/**"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/shopease

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: docker/setup-buildx-action@v3.8.0

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5.6.1
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix={{branch}}-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and load for the smoke test)
        uses: docker/build-push-action@v6.10.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:ci
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test /healthz against a real Mongo
        run: |
          docker network create smoke
          docker run -d --name mongo --network smoke mongo:7.0.14
          docker run -d --name app --network smoke -p 8080:8080 \
            -e MONGO_URL=mongodb://mongo:27017 -e JWT_SECRET=ci \
            -e BRAINTREE_MERCHANT_ID=x -e BRAINTREE_PUBLIC_KEY=x -e BRAINTREE_PRIVATE_KEY=x \
            ${{ env.IMAGE }}:ci
          for i in $(seq 1 30); do
            if curl -fsS localhost:8080/healthz; then echo; exit 0; fi
            sleep 2
          done
          echo "healthz never became ready"; docker logs app; exit 1

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6.10.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
