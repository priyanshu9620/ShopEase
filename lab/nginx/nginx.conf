# Lab load balancer. Discovers app replicas through Docker's DNS (service name "app" returns one
# A record per replica) and round-robins across them. `valid=5s` is the failover time when a replica
# dies (experiment 03) and the time a new one takes to receive traffic (experiment 02/04).
worker_processes auto;
events { worker_connections 4096; }

http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  access_log off;
  error_log /dev/stderr warn;

  # stub_status for the nginx_exporter / curl: active connections, requests/s
  server {
    listen 8080;
    location /nginx_status { stub_status; }
  }

  server {
    listen 80;

    location / {
      set $upstream app:8080;
      proxy_pass http://$upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Connection "";
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
      # retry another replica on connection failure / 502 — the "redundancy" half of experiment 03
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 3;
    }
  }
}
