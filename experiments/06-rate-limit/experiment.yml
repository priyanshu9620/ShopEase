# Experiment 06 — Rate limiting
id: 06-rate-limit
title: Rate limiting — one abusive client vs everyone else
concept: >
  A shared Redis counter per client and per second rejects requests above a quota with HTTP 429
  before they reach the database. Because the counter lives in Redis, the quota holds across all
  replicas. The goal is not to slow the abuser down for its own sake but to keep the other users'
  latency flat while it hammers.
question: When one client sends 300 req/s, what happens to normal users with and without a limiter?
what_changes: RATE_LIMIT_ENABLED=false → true, RATE_LIMIT_RPS=50 per client (lib/ratelimit.js)

arms:
  baseline:
    label: no limiter
    replicas: 3
    env: { CACHE_ENABLED: "false", RATE_LIMIT_ENABLED: "false" }
  treatment:
    label: 50 req/s per client
    replicas: 3
    env: { CACHE_ENABLED: "false", RATE_LIMIT_ENABLED: "true", RATE_LIMIT_RPS: "50" }

load:
  script: abuse.js
  rates: [300, 300, 300]       # normal users' total; the abuser adds 300 req/s from 1/3 of the way in
  step_s: 45
  warmup_s: 10

sla_ms: 300
max_error_pct: 1

metrics:
  - { name: rps,        unit: req/s, query: 'sum(rate(http_request_duration_seconds_count{job="app",route!~"/healthz|/metrics|/static/.*|other"}[15s]))' }
  - { name: rps_429,    unit: req/s, query: 'sum(rate(http_request_duration_seconds_count{job="app",status="429"}[15s])) or vector(0)' }
  - { name: p95_ms,     unit: ms, scale: 1000, query: 'histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="app",route!~"/healthz|/metrics|/static/.*|other",status!="429"}[15s])))' }
  - { name: mongo_ops,  unit: ops/s, query: 'sum(rate(mongodb_op_counters_total{type=~"query|getmore"}[15s]))' }
  - { name: app_cpu_pct, unit: '%', query: 'sum(100 * rate(process_cpu_seconds_total{job="app"}[15s]))' }

headline:
  - { metric: "k6:normal_rt.p(95)", label: normal users' p95 (ms) }
  - { metric: "k6:normal_429.rate", label: normal users' requests rejected (fraction) }
  - { metric: "k6:abuser_429.rate", label: abuser's requests rejected (fraction) }
  - { metric: mongo_ops:max,        label: peak Mongo ops/s }

caveats:
  - k6 is one IP, so clients are identified by an X-Client-Id header; production keys on the authenticated user or the real client IP from the load balancer.
  - Fixed 1-second windows allow up to 2× the quota across a window boundary; a token bucket or sliding log is stricter at the cost of more Redis work.
  - The abuser here is polite HTTP; a network-level flood needs the limit at the edge (ALB/WAF/CDN), not in the app.
