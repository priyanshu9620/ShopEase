# CD: on every push to master, build the image, push it to ECR with the commit SHA as the tag, then
# roll it out to the EC2 instances one at a time through SSM Run Command, waiting for the ALB to
# report the instance healthy before touching the next one. No AWS keys in GitHub: the job assumes
# the OIDC role created by infra/ (set repo variable AWS_DEPLOY_ROLE_ARN to its ARN).
name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2

jobs:
  deploy:
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2.0.1

      - uses: docker/setup-buildx-action@v3.8.0

      - name: Build and push :<sha> and :latest
        uses: docker/build-push-action@v6.10.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.ecr.outputs.registry }}/shopease:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/shopease:latest
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Rolling deploy, one instance at a time
        run: |
          set -euo pipefail
          TG=$(aws elbv2 describe-target-groups --names shopease-app --query 'TargetGroups[0].TargetGroupArn' --output text)
          IDS=$(aws ec2 describe-instances --filters Name=tag:Role,Values=app Name=instance-state-name,Values=running \
                --query 'Reservations[].Instances[].InstanceId' --output text)
          for id in $IDS; do
            echo "== $id: deploy ${GITHUB_SHA::7}"
            CMD=$(aws ssm send-command --instance-ids "$id" --document-name AWS-RunShellScript \
                  --comment "shopease deploy $GITHUB_SHA" \
                  --parameters "commands=[\"/opt/shopease/deploy.sh $GITHUB_SHA\"]" \
                  --query 'Command.CommandId' --output text)
            for i in $(seq 1 60); do
              S=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$id" --query Status --output text 2>/dev/null || echo Pending)
              [ "$S" = Success ] && break
              [ "$S" = Failed ] && { aws ssm get-command-invocation --command-id "$CMD" --instance-id "$id" --query StandardErrorContent --output text; exit 1; }
              sleep 5
            done
            echo "   waiting for the ALB to see $id healthy on the new version"
            for i in $(seq 1 60); do
              H=$(aws elbv2 describe-target-health --target-group-arn "$TG" --targets Id=$id --query 'TargetHealthDescriptions[0].TargetHealth.State' --output text)
              [ "$H" = healthy ] && break
              sleep 5
            done
            [ "$H" = healthy ] || { echo "$id never became healthy"; exit 1; }
          done
          echo "all instances on $GITHUB_SHA"
