# Publishes experiments/ (index.html + charts) to GitHub Pages so the lab results have a permanent URL
# that does not depend on anything running. Requires once: repo Settings → Pages → Source: GitHub Actions.
name: pages

on:
  push:
    branches: [master, "lab/**"]
    paths: ["experiments/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/configure-pages@v5.0.0
      - uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: experiments
      - id: deploy
        uses: actions/deploy-pages@v4.0.5
